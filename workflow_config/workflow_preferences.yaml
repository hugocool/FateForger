version: 1

system_of_record:
  product_context: notion
  knowledge_base: notion
  engineering_issue_tracker: github_issues
  engineering_pr_tracker: github_pull_requests
  local_ticket_markdown: temporary_mirror_only
  notion_to_github_link_required_for_codework: true
  github_to_notion_link_required_when_notion_exists: true

authority_split:
  github_authoritative_for:
    - scope_ready_for_implementation
    - acceptance_criteria_for_codework
    - branch_and_pr_status
    - ci_and_review_state
    - merge_readiness
  notion_authoritative_for:
    - product_intent_and_roadmap
    - discovery_and_research_notes
    - meeting_decisions
    - durable_knowledge_base

instruction_change_control:
  require_explicit_user_confirmation: true
  protected_files:
    - AGENTS.md
    - workflow_config/workflow_preferences.yaml

repo_cleanliness_gates:
  start_of_work_git_status_required: true
  pre_pr_close_git_status_required: true
  allow_dirty_start_if_baseline_recorded: true

workflow_change_process:
  channel: github_issue_prefix_workflow
  trial_window_prs: 2
  require_rollback_condition: true

progress_sync:
  primary_surface: github_pr_panel
  require_pr_or_issue_update_per_checkpoint: true
  sync_order: github_first_then_notion_summary
  checkpoint_events:
    - kickoff
    - substantial_change_batch
    - pre_pr_close
  require_end_of_reply_sync_footer: true
  fallback_mode_when_github_unavailable: provide_copy_ready_update_text
